name: deploy

# Builds the install-ready paclet from dev and publishes it to the main branch.
#
# The "build" is pure file restructuring: the contents of dev's TensorTools/
# source directory, plus PacletInfo.m and README.md, become the root of main.
# That is the layout Install.m expects (it searches the downloaded archive for
# TensorTools.m and copies its containing directory). No Wolfram Engine is
# needed, so this runs on a free GitHub-hosted runner.
#
# Documentation notebooks are copied across as-is from TensorTools/Documentation;
# they are not compiled here (that needs a front end, and is done by hand when
# the docs are updated).
#
# It runs via workflow_run so it only fires after the tests workflow succeeds,
# and only for the dev branch.
#
# IMPORTANT: workflow_run reads this file from the repository's *default branch*,
# so dev must be the default branch on GitHub. If main is still the default, this
# workflow will never trigger (silently). ConformalStructures has the same
# requirement.

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out dev at the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Assemble flattened paclet
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          cp -r TensorTools/. "$RUNNER_TEMP/build/"
          cp PacletInfo.m README.md "$RUNNER_TEMP/build/"

      - name: Publish to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git rm -rfq . || true
          cp -r "$RUNNER_TEMP/build/." .
          git add -A
          if git diff --cached --quiet; then
            echo "main already matches the dev build; nothing to publish."
          else
            git commit -m "Build paclet from dev @ ${HEAD_SHA:0:7}"
            git push origin main
          fi
